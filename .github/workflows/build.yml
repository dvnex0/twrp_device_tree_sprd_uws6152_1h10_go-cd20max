
name: Recovery Build - CD12MAX Touch Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVICE_TREE_REPOSITORY: ${{ github.repository }}
  DEVICE_TREE_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free build space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            gperf gcc-multilib gcc-10-multilib \
            g++-multilib g++-10-multilib libc6-dev \
            lib32ncurses5-dev x11proto-core-dev libx11-dev \
            tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev \
            libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush \
            schedtool squashfs-tools imagemagick libbz2-dev \
            lzma ncftp qemu-user-static libstdc++-10-dev \
            libncurses5 python3 unzip gzip file binutils

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install repo tool
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Analyze original CD12MAX boot
        shell: bash
        run: |
          set -euo pipefail

          BOOT_DIR="$RUNNER_TEMP/cd12max_boot"
          REPORT="$RUNNER_TEMP/cd12max-touch-analysis"
          UNPACK="$BOOT_DIR/unpacked"

          mkdir -p "$BOOT_DIR/extracted" "$UNPACK" "$REPORT"

          echo "Downloading original CD12MAX boot ZIP..."

          curl -fL --retry 3 \
            "https://github.com/dvnex0/Auto-TWRP-Builder/raw/master/boot.img.zip" \
            -o "$BOOT_DIR/boot.img.zip"

          unzip -o "$BOOT_DIR/boot.img.zip" \
            -d "$BOOT_DIR/extracted"

          BOOT_IMG="$BOOT_DIR/extracted/boot.img"
          test -s "$BOOT_IMG"

          file "$BOOT_IMG" | tee "$REPORT/boot-file.txt"
          sha256sum "$BOOT_IMG" | tee "$REPORT/boot-sha256.txt"

          python3 - "$BOOT_IMG" <<'PY'
          import sys

          with open(sys.argv[1], "rb") as f:
              magic = f.read(8)

          if magic != b"ANDROID!":
              print("ERROR: boot.img is not a standard Android boot image.")
              print("The workflow will stop instead of guessing its format.")
              sys.exit(1)

          print("Android boot image signature confirmed.")
          PY

          echo "Downloading Android's official boot unpacker..."

          curl -fsSL \
            "https://android.googlesource.com/platform/system/tools/mkbootimg/+/66a289ac2a92acb6ffd140214bd7141990a78b68/unpack_bootimg.py?format=TEXT" \
            -o "$REPORT/unpack_bootimg.py.b64"

          base64 -d "$REPORT/unpack_bootimg.py.b64" \
            > "$REPORT/unpack_bootimg.py"

          python3 "$REPORT/unpack_bootimg.py" \
            --boot_img "$BOOT_IMG" \
            --out "$UNPACK" \
            --format info \
            | tee "$REPORT/boot-info.txt"

          KERNEL="$UNPACK/kernel"
          test -s "$KERNEL"

          file "$KERNEL" | tee "$REPORT/kernel-file.txt"
          sha256sum "$KERNEL" | tee "$REPORT/kernel-sha256.txt"

          echo "Validating kernel architecture..."

          python3 - "$KERNEL" <<'PY'
          import gzip
          import sys

          path = sys.argv[1]

          with open(path, "rb") as f:
              header = f.read(64)

          if header.startswith(b"\x1f\x8b"):
              with gzip.open(path, "rb") as f:
                  header = f.read(64)

          if len(header) < 60 or header[56:60] != b"ARM\x64":
              print("ERROR: expected an ARM64 Linux Image kernel.")
              print("Refusing to replace the existing recovery kernel.")
              sys.exit(1)

          print("ARM64 Linux Image kernel signature confirmed.")
          PY

          echo "Searching for possible touchscreen driver strings..."

          if gzip -t "$KERNEL" 2>/dev/null; then
            gzip -dc "$KERNEL" > "$REPORT/kernel-scan.bin"
          else
            cp "$KERNEL" "$REPORT/kernel-scan.bin"
          fi

          strings -a "$REPORT/kernel-scan.bin" \
            | grep -iE \
              'goodix|gt9|focaltech|ft5|ft6|ilitek|himax|hx831|novatek|gslx|synaptics|cyttsp|touchscreen|touch_panel|tpd' \
            > "$REPORT/touch-driver-hints.txt" || true

          rm -f "$REPORT/kernel-scan.bin"

          echo "Extracted boot components:"
          find "$UNPACK" -maxdepth 2 -type f \
            -printf '%f (%s bytes)\n' \
            | tee "$REPORT/components.txt"

          echo "Boot analysis completed."

      - name: Initialize TWRP manifest
        id: init
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/workspace"
          cd "$GITHUB_WORKSPACE/workspace"

          echo "workspace_dir=$PWD" >> "$GITHUB_OUTPUT"

          git config --global user.name "DVNex"
          git config --global user.email \
            "dvnex0@users.noreply.github.com"

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni \
            -b twrp-9.0

      - name: Sync TWRP sources
        shell: bash
        run: |
          set -e
          repo sync -j4 --force-sync
        working-directory: ${{ steps.init.outputs.workspace_dir }}

      - name: Clone device tree
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_PATH="device/sprd/uws6152_1h10_go"

          mkdir -p device/sprd
          rm -rf "$DEVICE_PATH"

          git clone --depth=1 \
            --single-branch \
            --branch "$DEVICE_TREE_BRANCH" \
            "https://github.com/$DEVICE_TREE_REPOSITORY.git" \
            "$DEVICE_PATH"

          test -s "$DEVICE_PATH/BoardConfig.mk"
          test -s "$DEVICE_PATH/prebuilt/kernel"
          test -s "$DEVICE_PATH/prebuilt/dtbo.img"

        working-directory: ${{ steps.init.outputs.workspace_dir }}

      - name: Apply CD12MAX kernel
        shell: bash
        run: |
          set -euo pipefail

          DEVICE="$GITHUB_WORKSPACE/workspace/device/sprd/uws6152_1h10_go"
          REPORT="$RUNNER_TEMP/cd12max-touch-analysis"
          KERNEL="$RUNNER_TEMP/cd12max_boot/unpacked/kernel"

          test -s "$KERNEL"
          test -s "$DEVICE/prebuilt/kernel"
          test -s "$DEVICE/prebuilt/dtbo.img"
          test -s "$DEVICE/dtbo.img"

          echo "Backing up the original CD20MAX components..."

          cp "$DEVICE/prebuilt/kernel" \
            "$REPORT/kernel-cd20max-original"

          cp "$DEVICE/prebuilt/dtbo.img" \
            "$REPORT/dtbo-cd20max-original.img"

          sha256sum \
            "$REPORT/kernel-cd20max-original" \
            "$REPORT/dtbo-cd20max-original.img" \
            > "$REPORT/cd20max-component-hashes.txt"

          echo "Validating CD12MAX DTBO image..."

          python3 - "$DEVICE/dtbo.img" <<'PY'
          import os
          import sys

          path = sys.argv[1]
          with open(path, "rb") as f:
              magic = f.read(4)

          if magic != bytes.fromhex("d7b7ab1e"):
              print("ERROR: dtbo.img has an unexpected DT table magic.")
              sys.exit(1)

          if os.path.getsize(path) < 40:
              print("ERROR: dtbo.img is too small to be a valid DT table.")
              sys.exit(1)

          print("DTBO image signature confirmed.")
          PY

          echo "Installing the CD12MAX kernel and DTBO..."

          cp "$KERNEL" "$DEVICE/prebuilt/kernel"
          cp "$DEVICE/dtbo.img" "$DEVICE/prebuilt/dtbo.img"
          chmod 0644 "$DEVICE/prebuilt/kernel" "$DEVICE/prebuilt/dtbo.img"

          sha256sum "$DEVICE/prebuilt/kernel" \
            | tee "$REPORT/kernel-selected-for-build.txt"

          sha256sum "$DEVICE/prebuilt/dtbo.img" \
            | tee "$REPORT/dtbo-selected-for-build.txt"

          sed -i \
            's/^TW_DEVICE_VERSION[[:space:]]*:=[[:space:]].*/TW_DEVICE_VERSION := CD12MAX_TOUCH_CANDIDATE/' \
            "$DEVICE/BoardConfig.mk"

          cat > "$REPORT/BUILD-NOTES.txt" <<'EOF'
          Target: CD12MAX touchscreen recovery candidate.

          Kernel: extracted from the supplied original CD12MAX boot.img.
          DTBO: taken from dtbo.img at the root of the device-tree repository.
          Device tree: based on the CD20MAX device tree, with CD12MAX kernel
          and DTBO selected for this candidate.

          A successful compilation does not prove touchscreen operation.
          Physical-device testing is still required.
          EOF

          echo "CD12MAX kernel and DTBO installed in the build tree."

      - name: Configure optional Python 2 compatibility
        shell: bash
        continue-on-error: true
        run: |
          sudo apt-get install -y python2 || true

          if command -v python2 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v python2)" \
              /usr/local/bin/python
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          fi

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery candidate
        shell: bash
        run: |
          set -eo pipefail

          echo "Inicializando o ambiente TWRP..."
          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "Configurando o dispositivo..."
          lunch omni_uws6152_1h10_go-eng

          echo "Limpando compilação anterior..."
          make clean

          echo "Compilando recovery..."
          make recoveryimage -j2

          IMAGE="out/target/product/uws6152_1h10_go/recovery.img"

          test -s "$IMAGE"

          mkdir -p "$RUNNER_TEMP/CD12MAX-TWRP-touch-candidate"

          cp "$IMAGE" \
            "$RUNNER_TEMP/CD12MAX-TWRP-touch-candidate/recovery-CD12MAX-touch-candidate.img"

          sha256sum \
            "$RUNNER_TEMP/CD12MAX-TWRP-touch-candidate/recovery-CD12MAX-touch-candidate.img"
        working-directory: ${{ steps.init.outputs.workspace_dir }}

      - name: Upload recovery candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CD12MAX-TWRP-touch-candidate
          path: ${{ runner.temp }}/CD12MAX-TWRP-touch-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CD12MAX-TWRP-touch-diagnostics
          path: |
            ${{ runner.temp }}/cd12max-touch-analysis/
            ${{ runner.temp }}/cd12max_boot/unpacked/
          if-no-files-found: warn
          retention-days: 7
